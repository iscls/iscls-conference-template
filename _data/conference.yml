full_name: International Sanskrit Computational Linguistics Symposium
short_name: ISCLS
description: > # this means to ignore newlines until "baseurl:"
  ISCLS is a forum for original and unpublished research on various
  aspects of Computational Linguistics and Digital Humanities related to
  Sanskrit (Classical and Vedic), Prakrit, Pali, Buddhist Hybrid Sanskrit, etc.

